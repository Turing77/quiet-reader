<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纯净阅读</title>
<link rel="stylesheet" href="reader.css">
<script defer src="reader.js"></script>
</head>
<body>
<header><div class="bar">
<button id="back">← 原网页</button>
<div class="controls" role="group" aria-label="阅读设置">
<button id="smaller" aria-label="缩小字号">A−</button>
<button id="larger" aria-label="放大字号">A+</button>
<button id="theme" aria-pressed="false">深色</button>
</div>
</div></header>
<main>
<p id="status" role="status">正在读取正文…</p>
<article hidden><h1></h1><div id="content"></div></article>
</main>
</body>
</html>
